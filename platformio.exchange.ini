[RP2040_EXCHANGE_BASE]
build_flags =
  -D OPENKNX_USB_MSC
  -D USE_BLOCK_DEVICE_INTERFACE

; Is this a virtual memory size that is emulated for the host system? Therefore, it does not need to be adjusted.
[RP2040_EXCHANGE_FLASH_SIZE]
build_flags =
  -D EXCHANGE_FS_SIZE=0x01000000 ; 16MB

[RP2040_EXCHANGE_FLASH_OFFSET]
build_flags =
  -D EXCHANGE_FLASH_OFFSET=0x00100000 ; 1MB

[RP2040_EXCHANGE]
build_flags =
  ${RP2040_EXCHANGE_BASE.build_flags}
  ${RP2040_EXCHANGE_FLASH_SIZE.build_flags}
  ${RP2040_EXCHANGE_FLASH_OFFSET.build_flags}

; ================================= FLASH SIZES =================================
; The first 1 MiB is reserved so the partitioning is the same on every size; that is
; the minimum. Above it only the file system grows. The last 4 KiB hold the EEPROM
; emulation.
;
; Every filesystem_size MUST be a multiple of 4096 -- the flash erase sector size.

[RP2040_EXCHANGE_16MB]
extends = RP2040_EXCHANGE, RP2040_16MB
board_build.filesystem_size = 14675968 ; 16 - 1 system - 1 exchange - 4 KiB = 3583 * 4096
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x100000 ; 1 MiB

[RP2040_EXCHANGE_8MB]
extends = RP2040_EXCHANGE, RP2040_8MB
board_build.filesystem_size = 6549504 ; 8 - 1 system - 0,75 exchange - 4 KiB = 1599 * 4096
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0xC0000 ; 0,75 MiB

[RP2040_EXCHANGE_4MB]
extends = RP2040_EXCHANGE, RP2040_4MB
board_build.filesystem_size = 2617344 ; 4 - 1 system - 0,5 exchange - 4 KiB = 639 * 4096
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x80000 ; 0,5 MiB

[RP2040_EXCHANGE_2MB]
extends = RP2040_EXCHANGE, RP2040_2MB
board_build.filesystem_size = 782336 ; 2 - 1 system - 0,25 exchange - 4 KiB = 191 * 4096
build_flags =
  ${RP2040_EXCHANGE.build_flags}
  -D EXCHANGE_FLASH_SIZE=0x40000 ; 0,25 MiB
